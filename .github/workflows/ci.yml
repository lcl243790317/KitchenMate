name: KitchenMate CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen && pnpm typecheck
      - run: pnpm test
      - name: Source registry, license metadata and pinned snapshot validation
        run: pnpm recipes:validate
      - run: pnpm recipes:validate-translations
      - run: pnpm recipes:audit-ingredient-groups
      - run: pnpm recipes:audit-ingredient-completeness
      - run: pnpm recipes:audit-ingredient-semantics
      - run: pnpm recipes:coverage
      - run: pnpm recipes:primary-coverage
      - run: pnpm recipes:expansion-plan
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser Smoke (static verified catalog)
        run: pnpm test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: test-results/
